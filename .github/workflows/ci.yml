name: CI

on:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
            - name: Install packages
              run: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .
            - name: Tests
              run: python -m pytest
